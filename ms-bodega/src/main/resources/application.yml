server:
  port: 8083

spring:
  application:
    name: ms-bodega
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3309/db_bodega?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lumina_user}
    password: ${SPRING_DATASOURCE_PASSWORD:lumina_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        # Nuevas credenciales actualizadas desde AWS Academy:
        aws:
            access-key-id: ${AWS_ACCESS_KEY_ID:}
            secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
            session-token: ${AWS_SESSION_TOKEN:}

      sqs:
        # La cola "curso-pedidos" YA existe en AWS con su redrive policy hacia
        # "curso-pedidos-dlq". Con el default (CREATE) el framework crearia una cola
        # nueva SIN redrive policy y el escenario de DLQ no se cumpliria.
        queue-not-found-strategy: fail
        listener:
          max-inflight-messages-per-queue: 5
          max-messages-per-poll: 10
          poll-timeout: 20s

lumina:
  sqs:
    cola-pedidos: curso-pedidos
    cola-dlq: curso-pedidos-dlq

bodega:
  stock-critico-umbral: 10