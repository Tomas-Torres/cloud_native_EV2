server:
  port: 8086

spring:
  application:
    name: ms-pagos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3312/db_pagos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:lumina_user}
    password: ${SPRING_DATASOURCE_PASSWORD:lumina_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        # Credenciales AWS via variables de entorno (AWS Academy / IAM role / perfil).
        # Sin credenciales explicitas se usa la cadena por defecto del AWS SDK.
        # Spring Cloud AWS 3.x no expone el session-token como property oficial
        # (CredentialsProperties solo bindea access-key/secret-key), por eso
        # AwsCredentialsConfig lo lee de aqui para soportar credenciales temporales.
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        session-token: ${AWS_SESSION_TOKEN:}
      sqs:
        # La cola "curso-pedidos" YA existe en AWS con su redrive policy hacia
        # "curso-pedidos-dlq" -> no dejar que el framework cree una cola sin DLQ.
        queue-not-found-strategy: fail
        listener:
          max-inflight-messages-per-queue: 5
          max-messages-per-poll: 10
          poll-timeout: 20s

lumina:
  sqs:
    cola-pedidos: curso-pedidos
    cola-dlq: curso-pedidos-dlq

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-ACCESS-TOKEN}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:http://localhost:8086/api/pagos/notifications}

management:
  endpoints:
    web:
      exposure:
        include: health,info
